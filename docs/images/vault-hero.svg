<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">Kaagaz Vault</title>
  <desc id="desc">An abstract blue document vault with layered paper and a secure lock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="0.55" stop-color="#123a70"/>
      <stop offset="1" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9efff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#6eb7ff" stop-opacity=".72"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#46a6ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#46a6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1120" cy="300" r="350" fill="url(#glow)"/>
  <g fill="none" stroke="#6db8ff" stroke-opacity=".22">
    <path d="M0 480 500 0M160 620 780 0M840 620 1460 0M1170 620 1600 190"/>
    <circle cx="1120" cy="310" r="235"/><circle cx="1120" cy="310" r="270"/>
  </g>
  <g transform="translate(860 95)">
    <rect x="95" y="55" width="310" height="390" rx="24" fill="#0a1a32" stroke="#6eb7ff" stroke-opacity=".5" stroke-width="3" transform="rotate(9 250 250)"/>
    <rect x="55" y="35" width="310" height="390" rx="24" fill="#102d52" stroke="#8ccaff" stroke-opacity=".65" stroke-width="3" transform="rotate(-5 210 230)"/>
    <rect x="25" y="25" width="310" height="390" rx="24" fill="url(#glass)" stroke="#e3f4ff" stroke-opacity=".9" stroke-width="3"/>
    <path d="M78 105h170M78 139h205M78 173h150" stroke="#164a80" stroke-opacity=".65" stroke-width="12" stroke-linecap="round"/>
    <rect x="82" y="230" width="196" height="130" rx="22" fill="#09203e" stroke="#b9e1ff" stroke-width="4"/>
    <path d="M126 230v-35a54 54 0 0 1 108 0v35" fill="none" stroke="#09203e" stroke-width="20" stroke-linecap="round"/>
    <circle cx="180" cy="283" r="16" fill="#a6d9ff"/>
    <path d="M180 296v24" stroke="#a6d9ff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="105" y="235" font-size="26" letter-spacing="8" fill="#8dcaff">PRIVATE DOCUMENT VAULT</text>
    <text x="100" y="325" font-size="82" font-weight="700">KAAGAZ</text>
    <text x="100" y="410" font-size="82" font-weight="700" fill="#8dcaff">VAULT</text>
    <text x="105" y="470" font-size="25" fill="#d5eaff">Your documents. Your device.</text>
    <text x="105" y="508" font-size="25" fill="#d5eaff">Offline-first by design.</text>
  </g>
</svg>