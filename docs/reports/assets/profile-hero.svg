<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">David — privacy-minded software builder</title>
  <desc id="desc">A refined deep-ink and evergreen-teal banner with geometric rings, a warm amber accent, and a 35 percent weighted product-progress indicator for Kaagaz Vault.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#F7F5EF" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172B2A"/>
      <stop offset=".58" stop-color="#203F3C"/>
      <stop offset="1" stop-color="#142624"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78AAA2"/>
      <stop offset="1" stop-color="#246B67"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#field)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <path d="M0 276C180 230 280 330 440 282S700 250 830 320H0Z" fill="#246B67" fill-opacity=".12"/>
