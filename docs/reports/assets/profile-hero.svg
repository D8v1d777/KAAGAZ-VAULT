  <text x="62" y="181" fill="#F7F5EF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="750" letter-spacing="-1.5">DAVID</text>
  <text x="66" y="216" fill="#A9C9C2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="550">D8v1d777</text>
  <text x="66" y="259" fill="#F7F5EF" fill-opacity=".86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="450">Privacy-minded systems · Human-centred engineering</text>
  <path d="M66 284H294" stroke="#246B67" stroke-width="3" stroke-linecap="round"/>
  <path d="M66 284H146" stroke="#D6A65D" stroke-width="3" stroke-linecap="round"/>
