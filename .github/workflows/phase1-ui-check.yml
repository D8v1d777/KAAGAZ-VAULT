name: Phase 1 UI checks

on:
  push:
    branches: [feat/accessible-vault-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free UI checks
        run: node --test scripts/validate-phase1.test.mjs
