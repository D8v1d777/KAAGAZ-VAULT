name: Phase 1 UI checks

on:
  push:
    branches: [feat/accessible-vault-foundation, feat/e2ee-and-human-centered-design]
  pull_request:
    branches: [main, feat/accessible-vault-foundation]

concurrency:
  group: phase1-ui-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run static, browser, and axe checks
        run: npm test
