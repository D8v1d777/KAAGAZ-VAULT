name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test tasks, lint, and offline manifest gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools"

      - name: Install required Android SDK packages
        run: sdkmanager --channel=3 --install "platforms;android-37" "build-tools;37.0.0"

      - name: Build, run available unit tests, and lint
        run: gradle --no-daemon clean assembleDebug testDebugUnitTest lint

      - name: Enforce offline merged-manifest policy
        run: python3 scripts/check_offline_manifest.py
