name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest CI run per branch/PR; rapid small commits should not queue stale builds.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test tasks, lint, and offline manifest gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Test offline manifest policy helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build debug and release, run unit tests, and lint
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease testDebugUnitTest lint

      - name: Enforce offline merged-manifest policy
        run: python3 scripts/check_offline_manifest.py
