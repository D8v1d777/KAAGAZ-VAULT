name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Keep only the newest CI run per branch/PR; rapid small commits should not queue stale builds.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test tasks, lint, and offline manifest gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Test offline manifest policy helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build debug and release, run unit tests, and lint
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest lint

      - name: Verify OCR model preparation is up-to-date
        shell: bash
        run: |
          set -euo pipefail
          output="$(./gradlew --no-daemon :app:prepareOcrModels)"
          printf '%s\n' "$output"
          grep -Fq ':app:prepareOcrModels UP-TO-DATE' <<< "$output"

      - name: Enforce offline merged-manifest policy
        run: python3 scripts/check_offline_manifest.py

  android-instrumented-tests:
    name: Android emulator instrumentation (Keystore auth-per-use)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools"

      - name: Install required Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented security tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          # The pinned runner executes script lines in separate shells; keep setup, cleanup and tests in one shell.
          script: >-
            set -eu; adb shell locksettings set-pin 2468 && trap 'status=$?; adb shell locksettings clear --old 2468 >/dev/null || status=1; exit "$status"' EXIT && ./gradlew --no-daemon :app:connectedDebugAndroidTest && python3 scripts/capture_runtime_ui.py

      - name: Verify runtime UI screenshot evidence and provenance
        if: success()
        run: |
          set -euo pipefail
          test -s docs/images/ui/setup-required-android36.png
          test -s docs/images/ui/capture-metadata.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          image = Path("docs/images/ui/setup-required-android36.png")
          metadata = json.loads(Path("docs/images/ui/capture-metadata.json").read_text(encoding="utf-8"))
          assert metadata.get("source_sha") not in (None, "", "unknown"), "missing PR source SHA"
          assert metadata.get("workflow_run_id") == os.environ["GITHUB_RUN_ID"], "workflow run provenance mismatch"
          assert image.as_posix() in metadata.get("screenshots", []), "PNG absent from screenshot manifest"
          assert metadata.get("sha256") == hashlib.sha256(image.read_bytes()).hexdigest(), "PNG SHA-256 mismatch"
          assert image.stat().st_size > 4096, "PNG unexpectedly small"
          print("Runtime UI screenshot provenance verified.")
          PY
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Upload runtime UI screenshot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kaagaz-vault-runtime-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/images/ui/*.png
            docs/images/ui/capture-metadata.json
          if-no-files-found: error
          retention-days: 7
